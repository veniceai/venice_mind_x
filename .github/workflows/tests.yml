name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Live tests (-m live) need VENICE_API_KEY and are excluded by pytest.ini.
      - run: python -m pytest
      - run: python test_local.py --offline-only
